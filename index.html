<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GT3 // EXPLODED SPECIFICATION</title>
  
  <!-- Studio Stylesheet -->
  <link rel="stylesheet" href="tier1/css/style.css">
  
  <style>
    /* Loading Splash Overlay */
    #loading-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #f5f5f7;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      transition: opacity 0.4s ease;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .loading-spinner {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(0, 0, 0, 0.08);
      border-top-color: #0071e3;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 18px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    #loading-text {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.2em;
      color: #6e6e73;
      text-transform: uppercase;
      font-family: monospace;
    }
  </style>
</head>
<body>

  <!-- Loading Splash Screen -->
  <div id="loading-overlay">
    <div class="loading-spinner"></div>
    <div id="loading-text">INITIALIZING SCENE // 0%</div>
  </div>

  <!-- 400vh Scroll Runway -->
  <div class="scroll-track">
    <div class="sticky-viewport">
      
      <!-- 3D WebGL Canvas -->
      <canvas id="webgl-canvas"></canvas>

      <!-- Glass UI Layer -->
      <div class="ui-layer">
        
        <!-- Header Branding -->
        <header class="brand-header">
          <span class="brand-tag">ENGINEERING DEMONSTRATION // TIER 1</span>
          <h1 class="brand-title">GT3 SPECIFICATION</h1>
        </header>

        <!-- Real-Time Telemetry HUD -->
        <aside class="debug-hud">
          <div class="hud-item">
            <span class="hud-label">FPS</span>
            <span class="hud-value active" id="hud-fps-val">--</span>
          </div>
          <div class="hud-item">
            <span class="hud-label">SCROLL</span>
            <span class="hud-value" id="hud-scroll-val">0.000</span>
          </div>
          <div class="hud-item">
            <span class="hud-label">PARTS</span>
            <span class="hud-value" id="hud-parts-val">227</span>
          </div>
          <div class="hud-item" style="min-width: 100px;">
            <span class="hud-label">SCRUB / TEST</span>
            <input type="range" id="hud-scrub-slider" min="0" max="1000" value="0" style="cursor: pointer; width: 100%; margin-top: 2px;">
          </div>
        </aside>

        <!-- Footer Scroll Prompt -->
        <footer class="footer-hint">
          <div class="scroll-indicator">
            <span>SCROLL TO DECONSTRUCT</span>
            <div class="scroll-line">
              <div class="scroll-line-fill" id="scroll-fill"></div>
            </div>
          </div>
          <div style="font-size: 11px; opacity: 0.6;">
            PHASE 1 // SCENE &amp; SCROLL SHELL
          </div>
        </footer>

      </div>
    </div>
  </div>

  <!-- Core External 3D Libraries (CDN) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <!-- Modular Scripts -->
  <script src="tier1/js/scroll.js"></script>
  <script src="tier1/js/explode.js"></script>
  <script src="tier1/js/camera-path.js"></script>
  <script src="tier1/js/main.js"></script>

</body>
</html>
